name: Deploy to czytajksef.pl

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-czytajksef
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate FTP secrets
        if: ${{ secrets.FTP_SERVER == '' || secrets.FTP_USERNAME == '' || secrets.FTP_PASSWORD == '' }}
        run: |
          echo "::error::Missing required secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD). Add them in Settings -> Secrets and variables -> Actions and re-run."
          exit 1

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /domains/czytajksef.pl/public_html/
